[build]
builder = "NIXPACKS"
buildCommand = "pip install --upgrade pip && poetry install --only main --no-dev"

[nixpacks.pkgs]
pkgs = ["build-essential", "python3-dev"]

[deploy]
startCommand = "poetry run python -m app"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/"
healthcheckTimeout = 300
